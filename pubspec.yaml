name: happy_weds_vendors
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+7

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  # AUDIT NOTE: main.dart already imported `package:flutter_localizations/…`
  # (for GlobalMaterialLocalizations) but the package was never declared here.
  # It only resolved transitively through flutter_quill, which the
  # `depend_on_referenced_packages` lint flagged and which would have broken
  # the app the moment flutter_quill was removed or bumped. Declared directly.
  flutter_localizations:
    sdk: flutter

  shared_preferences: ^2.1.1
  image_picker: ^1.1.1
  video_player: ^2.7.0
  youtube_player_flutter: ^9.0.1
  share_plus: ^10.0.5
  fl_chart: ^0.69.0
  lottie: ^3.1.2
  url_launcher: ^6.3.0
  http:
  intl: ^0.20.2
  flutter_riverpod: ^3.2.0
  # Quill Editor
  flutter_quill: ^11.0.0-dev.15
  flutter_quill_extensions: ^11.0.0-dev.1
  internet_connection_checker:
  cupertino_icons: ^1.0.8
  country_state_city: ^0.1.0
  html_editor_enhanced: ^2.6.0
  google_maps_flutter: ^2.14.0
  chewie: ^1.7.1
  table_calendar: ^3.0.9
  dropdown_search: ^6.0.3
  video_thumbnail: ^0.5.3
  path_provider: ^2.0.15
  provider: ^6.0.5
  shimmer: ^3.0.0
  pdf:
  printing:
  connectivity_plus: ^7.0.0
  mime: ^2.0.0
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  permission_handler: ^11.3.0
  gal: ^2.3.0


  # AUDIT NOTE — UNDECLARED DIRECT DEPENDENCIES.
  # `lib/movments_plus/upload_screen.dart` imports both of these directly
  # (`package:file_picker/file_picker.dart` and
  # `package:http_parser/http_parser.dart`) but neither was declared here —
  # they only resolved transitively. That is exactly the situation the
  # `depend_on_referenced_packages` lint warns about: the day an unrelated
  # dependency stops pulling them in, media upload stops compiling.
  # Pinned to the versions already in pubspec.lock so resolution is unchanged.
  file_picker: ^10.3.7
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logoo.png
    - assets/Logo.png
    - assets/icons/app_icon.png
    - assets/icons/home.png
    - assets/icons/leads.png
    - assets/icons/statistics.png
    - assets/icons/reviews.png
    - assets/images/

  # ==========================================================================
  # POPPINS — the single font family for the whole application.
  #
  # AUDIT NOTE: the app previously shipped no fonts at all and MaterialApp had
  # no `theme:`, so every screen rendered in Flutter's default Roboto. The TTFs
  # are bundled (rather than fetched at runtime via google_fonts) so the
  # typography is identical offline and on first launch, with no network
  # dependency and no first-frame font swap.
  #
  # Wired up in lib/theme/app_theme.dart via `fontFamily: 'Poppins'`.
  # ==========================================================================
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700



